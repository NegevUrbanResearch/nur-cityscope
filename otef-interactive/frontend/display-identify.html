<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Identify display</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #102337; color: #fff; }
      main { text-align: center; padding: 12px; }
      p { margin: 0; font-size: 14px; color: #cbdbea; }
      h1 { margin: 0; font-size: clamp(80px, 48vh, 160px); line-height: 1.05; font-weight: 700; }
      button { margin-top: 16px; padding: 7px 20px; border: 1px solid #9dbad1; border-radius: 5px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main aria-label="Display identification">
      <p>Display</p>
      <h1 id="displayNumber" aria-label="Display number">—</h1>
      <p>Closes automatically · Esc to dismiss</p>
      <button id="closeIdentify" type="button">Close</button>
    </main>
    <script type="module" src="./src/entries/display-identify-main.js"></script>
  </body>
</html>

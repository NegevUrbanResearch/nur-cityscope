<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#066ACF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>הקרנה · הספרייה הלאומית</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --nli-ink: #1a1a1a;
        --nli-ink-soft: #1c1b1f;
        --nli-gray: #7c7272;
        --nli-gray-2: #707070;
        --nli-line: #d9d9d9;
        --nli-paper: #fffaf8;
        --nli-cream: #fffbeb;
        --nli-yellow: #ffd600;
        --nli-blue: #066acf;
        --font: "Heebo", Arial, sans-serif;
        --text-ui: clamp(16px, 1.15vh + 0.55vw, 19px);
        --text-h2: clamp(20px, 1.7vh + 0.7vw, 28px);
        --text-status: clamp(26px, 3.4vh + 0.4vw, 40px);
        --text-meta: clamp(12px, 1vh + 0.25vw, 15px);
        --text-kicker: clamp(11px, 0.9vh + 0.2vw, 13px);
        --radius-badge: 10px;
        --tap: clamp(44px, 6.4vh, 56px);
        --header-btn: 64px;
        --header-icon: 40px;
        --header-pad: 8px;
        --pad: clamp(16px, 2.4vw, 32px);
        --gap: clamp(6px, 1.1vh, 12px);
        --space: clamp(8px, 1.5vh, 20px);
      }

      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        overflow: hidden;
      }
      body {
        margin: 0;
        background: #f3eee8;
        color: var(--nli-ink);
        font-family: var(--font);
        font-size: var(--text-ui);
        font-weight: 400;
        line-height: 1.35;
        display: flex;
        justify-content: center;
      }

      button, input {
        font: inherit;
        color: inherit;
      }
      button {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        touch-action: manipulation;
      }
      h1, h2, h3 {
        margin: 0;
        font-weight: 300;
      }

      .app {
        height: 100dvh;
        width: 100%;
        max-width: 1280px;
        background: var(--nli-paper);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        overscroll-behavior: none;
      }

      @media (min-width: 480px) {
        .app { box-shadow: 0 0 0 1px var(--nli-line); }
      }

      .icon {
        width: 22px;
        height: 22px;
        display: block;
        color: var(--nli-ink-soft);
      }
      [dir="rtl"] .icon--directional { transform: scaleX(-1); }

      :focus-visible {
        outline: 3px solid var(--nli-blue);
        outline-offset: 2px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: calc(var(--header-btn) + (var(--header-pad) * 2));
        padding: var(--header-pad) var(--pad);
        padding-top: max(var(--header-pad), env(safe-area-inset-top));
        border-bottom: 1px solid var(--nli-line);
        background: var(--nli-paper);
        flex-shrink: 0;
      }
      .header-side {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: var(--header-btn);
        min-height: var(--header-btn);
      }
      .header-side--end { justify-content: flex-end; }
      .home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--header-btn);
        height: var(--header-btn);
        min-width: var(--header-btn);
        min-height: var(--header-btn);
        color: var(--nli-ink);
      }
      .home-btn .icon {
        width: var(--header-icon);
        height: var(--header-icon);
        stroke-width: 1.6;
      }
      .home-btn[hidden] { display: none; }

      .locale {
        display: flex;
        border: 1px solid var(--nli-line);
      }
      .locale button {
        min-width: 44px;
        min-height: var(--header-btn);
        padding-inline: 10px;
        font-size: var(--text-ui);
        font-weight: 600;
        color: var(--nli-ink);
      }
      .locale button.is-active {
        background: var(--nli-ink);
        color: var(--nli-paper);
      }

      .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
      .screen {
        display: none;
        flex: 1;
        flex-direction: column;
        min-height: 0;
        overflow: hidden;
        padding: var(--space) var(--pad);
        padding-bottom: max(var(--space), env(safe-area-inset-bottom));
      }
      .screen.is-active { display: flex; }
      .screen[hidden] { display: none !important; }

      .kicker {
        font-size: var(--text-kicker);
        font-weight: 600;
        color: var(--nli-gray-2);
        letter-spacing: 0.06em;
        margin: 0 0 2px;
      }
      .page-title {
        font-size: var(--text-h2);
        line-height: 1.15;
      }
      .lede {
        color: var(--nli-gray-2);
        margin: 4px 0 0;
        font-size: var(--text-meta);
        max-width: 42ch;
      }

      .nav-list {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(6, minmax(0, 1fr));
        gap: var(--gap);
      }
      .nav-card {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        min-height: 0;
        height: 100%;
        text-align: start;
        padding: 0 clamp(12px, 2vw, 18px);
        background: var(--nli-cream);
        border: 1px solid transparent;
        overflow: hidden;
      }
      .nav-card--quiet {
        background: transparent;
        border-color: var(--nli-line);
      }
      .nav-card-index {
        font-size: var(--text-status);
        font-weight: 300;
        line-height: 1;
        color: var(--nli-line);
        width: 1.4em;
        flex-shrink: 0;
        text-align: end;
      }
      .nav-card-copy { flex: 1; min-width: 0; }
      .nav-card-title,
      .nav-card-meta,
      .result-name,
      .result-place {
        display: block;
      }
      .nav-card-title {
        font-size: var(--text-h2);
        font-weight: 300;
        line-height: 1.15;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nav-card-meta {
        margin-top: 2px;
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .player-body {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        padding: var(--space) var(--pad);
      }
      #player.screen { padding: 0; }
      .player-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-shrink: 0;
      }
      .badge-live {
        background: var(--nli-yellow);
        color: var(--nli-ink);
        border-radius: var(--radius-badge);
        padding: 2px 8px;
        font-size: var(--text-kicker);
        font-weight: 600;
        letter-spacing: 0.04em;
      }
      .step-count {
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
      }
      .ticks {
        display: flex;
        gap: 6px;
        margin: 10px 0 var(--space);
        flex-shrink: 0;
      }
      .ticks span {
        flex: 1;
        height: 2px;
        background: var(--nli-line);
      }
      .ticks span.is-done,
      .ticks span.is-current { background: var(--nli-ink); }
      .ticks span.is-current { height: 3px; }

      .clock {
        font-size: var(--text-status);
        font-weight: 300;
        line-height: 1;
        letter-spacing: -0.02em;
        margin-bottom: 4px;
        flex-shrink: 0;
      }
      .clock:empty { display: none; }
      .step-title {
        font-size: var(--text-h2);
        line-height: 1.15;
        margin-bottom: 8px;
        flex-shrink: 0;
      }
      .step-note {
        margin: 0;
        max-width: 46ch;
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
      }
      .draft-note { color: var(--nli-gray-2); }

      .kit {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 8px;
        margin-top: var(--space);
      }
      .kit-reset {
        margin: 0;
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
      }
      .kit-idle {
        margin: 0;
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
      }
      .kit-block { flex-shrink: 0; }
      .kit-block[hidden],
      .kit-idle[hidden] { display: none !important; }

      .kit-action .btn { width: 100%; }
      .mi {
        width: 22px;
        height: 22px;
        fill: currentColor;
        display: block;
      }
      .staff-connection {
        font-size: var(--text-ui);
        font-weight: 600;
        color: var(--nli-ink);
        white-space: nowrap;
      }
      .staff-connection:not(.is-on) { color: var(--nli-gray); }
      #table-switcher { display: none !important; }

      .nli-tl-sheet { padding: 0; }
      .nli-tl-sheet[aria-disabled="true"] {
        opacity: 0.45;
        pointer-events: none;
      }
      .nli-tl-clock {
        text-align: center;
        font-variant-numeric: tabular-nums;
        font-size: var(--text-kicker);
        color: var(--nli-gray-2);
        direction: ltr;
        unicode-bidi: isolate;
        margin-bottom: 6px;
      }
      .nli-tl-dock {
        display: flex;
        direction: ltr;
        unicode-bidi: isolate;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .nli-tl-btn {
        width: 44px;
        height: 44px;
        border-radius: 0;
        background: var(--nli-cream);
        border: 1px solid var(--nli-line);
        color: var(--nli-ink);
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
      }
      .nli-tl-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .nli-tl-btn--play {
        background: var(--nli-ink);
        color: var(--nli-paper);
        border-color: var(--nli-ink);
        width: 52px;
        height: 52px;
      }
      .nli-tl-loop--on {
        background: var(--nli-yellow);
        border-color: var(--nli-yellow);
        color: var(--nli-ink);
      }
      .nli-tl-btn svg,
      .nli-tl-step svg {
        display: block;
        fill: currentColor;
        width: 22px;
        height: 22px;
      }
      .nli-tl-scrub-row {
        display: flex;
        direction: ltr;
        unicode-bidi: isolate;
        align-items: center;
        gap: 12px;
        position: relative;
        padding-top: 22px;
      }
      .nli-tl-step {
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        border: 1px solid var(--nli-gray);
        background: transparent;
        color: var(--nli-ink);
        display: grid;
        place-items: center;
        padding: 0;
        cursor: pointer;
      }
      .nli-tl-step:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .nli-tl-track {
        flex: 1;
        height: 52px;
        position: relative;
        display: flex;
        align-items: center;
        direction: ltr;
        unicode-bidi: isolate;
        touch-action: none;
      }
      .nli-tl-track-line {
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: var(--nli-line);
        border-radius: 2px;
      }
      .nli-tl-track-fill {
        position: absolute;
        left: 0;
        height: 4px;
        background: var(--nli-yellow);
        border-radius: 2px;
      }
      .nli-tl-ticks {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        pointer-events: none;
      }
      .nli-tl-tick {
        position: absolute;
        top: 50%;
        width: 1px;
        height: 14px;
        margin-top: -7px;
        transform: translateX(-50%);
        background: var(--nli-gray);
      }
      .nli-tl-tick--hour {
        height: 24px;
        margin-top: -12px;
        background: var(--nli-ink);
        width: 1.5px;
      }
      .nli-tl-thumb {
        position: absolute;
        top: 50%;
        width: 22px;
        height: 22px;
        margin: -11px 0 0 -11px;
        border-radius: 50%;
        background: var(--nli-ink);
        border: 2px solid var(--nli-yellow);
        pointer-events: none;
      }
      .nli-tl-hours {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 2px;
        font-size: 9px;
        color: var(--nli-gray-2);
        direction: ltr;
        unicode-bidi: isolate;
        font-variant-numeric: tabular-nums;
        pointer-events: none;
      }
      .nli-tl-hours span {
        position: absolute;
        bottom: 0;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .nli-tl-bubble {
        position: absolute;
        top: -4px;
        transform: translate(-50%, -100%);
        background: var(--nli-yellow);
        color: var(--nli-ink);
        font-size: 12px;
        font-weight: 600;
        padding: 4px 8px;
        border-radius: 0;
        direction: ltr;
        unicode-bidi: isolate;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        pointer-events: none;
      }
      .nli-tl-bubble::after {
        content: "";
        position: absolute;
        left: 50%;
        bottom: -5px;
        margin-left: -5px;
        border: 5px solid transparent;
        border-top-color: var(--nli-yellow);
      }
      .free-bottom {
        margin-top: auto;
        display: flex;
        flex-direction: column;
        gap: var(--space);
        padding-top: clamp(16px, 3vh, 28px);
        flex-shrink: 0;
      }

      .screens {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0 20px;
        margin-top: auto;
        padding-top: var(--space);
        border-top: 1px solid var(--nli-line);
        flex-shrink: 0;
      }
      .screen-row { min-width: 0; }
      .screen-row + .screen-row {
        border-inline-start: 1px solid var(--nli-line);
        padding-inline-start: 20px;
      }
      .screen-label {
        display: block;
        font-size: var(--text-kicker);
        font-weight: 600;
        letter-spacing: 0.06em;
        color: var(--nli-gray-2);
        margin-bottom: 4px;
      }
      .screen-copy {
        margin: 0;
        font-size: var(--text-meta);
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 3;
        overflow: hidden;
      }

      .dock {
        flex-shrink: 0;
        padding: 10px var(--pad);
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        border-top: 1px solid var(--nli-line);
        background: var(--nli-paper);
        display: grid;
        grid-template-columns: 1fr 1.6fr;
        gap: 8px;
      }
      .btn {
        min-height: var(--tap);
        padding-inline: 20px;
        font-weight: 600;
        font-size: var(--text-ui);
        border: 1px solid var(--nli-ink);
        background: var(--nli-ink);
        color: var(--nli-paper);
      }
      .btn--outline {
        background: transparent;
        color: var(--nli-ink);
        border-color: var(--nli-gray);
      }
      .btn:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .search {
        position: relative;
        flex-shrink: 0;
        margin-bottom: var(--gap);
        z-index: 2;
      }
      .search-icon {
        position: absolute;
        inset-block-start: 50%;
        inset-inline-start: 14px;
        transform: translateY(-50%);
        pointer-events: none;
        color: var(--nli-gray);
      }
      .search input {
        width: 100%;
        height: var(--tap);
        padding-inline: 44px 16px;
        border: 1px solid var(--nli-line);
        background: var(--nli-paper);
        appearance: none;
        border-radius: 0;
      }
      .search input::placeholder { color: var(--nli-gray); }
      .results {
        position: absolute;
        inset-inline: 0;
        top: calc(100% - 1px);
        margin: 0;
        padding: 0;
        list-style: none;
        border: 1px solid var(--nli-line);
        background: var(--nli-paper);
        display: none;
        max-height: min(28dvh, 220px);
        overflow: auto;
      }
      .results.is-open { display: block; }
      .results button {
        width: 100%;
        text-align: start;
        min-height: 44px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--nli-line);
      }
      .results li:last-child button { border-bottom: 0; }
      .result-place {
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
      }

      .free-status {
        min-height: 1.2em;
        margin: 0 0 var(--gap);
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
        flex-shrink: 0;
      }
      .free-status.is-live {
        color: var(--nli-ink);
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        flex-shrink: 0;
        background: var(--nli-yellow);
        border-radius: 50%;
      }

      .scene-list {
        flex: 1 1 auto;
        min-height: 112px;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, minmax(0, 1fr));
        gap: var(--gap);
        margin-bottom: var(--space);
      }
      @media (min-width: 720px) {
        .scene-list {
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: minmax(0, 1fr);
        }
      }
      .scene-btn {
        width: 100%;
        height: 100%;
        min-height: 112px;
        padding: 16px 14px;
        text-align: start;
        border: 1px solid var(--nli-line);
        background: transparent;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 8px;
      }
      .scene-btn.is-active {
        background: var(--nli-ink);
        border-color: var(--nli-ink);
        color: var(--nli-paper);
      }
      .scene-btn-title {
        display: block;
        font-size: var(--text-h2);
        font-weight: 400;
        line-height: 1.15;
      }
      .scene-btn-meta {
        display: block;
        font-size: var(--text-meta);
        font-weight: 400;
        color: var(--nli-gray-2);
        line-height: 1.35;
      }
      .scene-btn.is-active .scene-btn-meta { color: #d9d0c8; }

      .free-deck {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        position: relative;
        z-index: 2;
      }
      .free-navigate {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        max-width: 28rem;
        width: 100%;
        margin-inline: auto;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .dpad-container {
        display: flex;
        justify-content: center;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .dpad {
        position: relative;
        width: 200px;
        height: 200px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
        gap: 4px;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .dpad-button {
        background: var(--nli-cream);
        border: 2px solid var(--nli-line);
        color: var(--nli-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        min-width: 44px;
        padding: 0;
        touch-action: none;
        user-select: none;
      }
      .dpad-button:active,
      .dpad-button.active {
        background: var(--nli-ink);
        border-color: var(--nli-ink);
        color: var(--nli-paper);
      }
      .dpad-button svg {
        width: 24px;
        height: 24px;
        stroke-width: 2.5;
      }
      .dpad-up { grid-column: 2; grid-row: 1; }
      .dpad-left { grid-column: 1; grid-row: 2; }
      .dpad-right { grid-column: 3; grid-row: 2; }
      .dpad-down { grid-column: 2; grid-row: 3; }
      .joystick-container,
      .joystick-zone {
        grid-column: 2;
        grid-row: 2;
        position: relative;
        width: 100px;
        height: 100px;
        min-width: 100px;
        min-height: 100px;
        justify-self: center;
        align-self: center;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        user-select: none;
        direction: ltr;
        unicode-bidi: isolate;
      }
      #joystickZone .nipple {
        right: auto !important;
      }
      .joystick-base {
        width: 50px;
        height: 50px;
        border: 2px solid var(--nli-line);
        border-radius: 50%;
        pointer-events: none;
        opacity: 0.6;
      }
      .joystick-zone.active .joystick-base {
        border-color: var(--nli-ink);
        opacity: 1;
      }
      #joystickZone .back {
        background: var(--nli-cream) !important;
        border: 2px solid var(--nli-line) !important;
      }
      #joystickZone .front {
        background: var(--nli-ink) !important;
        border: 1px solid rgba(26, 26, 26, 0.35) !important;
      }
      #joystickZone.active .back {
        border-color: var(--nli-ink) !important;
      }
      .zoom-controls {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .zoom-display {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: var(--text-meta);
      }
      .zoom-label { color: var(--nli-gray-2); }
      .zoom-value {
        color: var(--nli-ink);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        min-width: 2ch;
        text-align: end;
      }
      .zoom-slider-container {
        display: flex;
        align-items: center;
        gap: 8px;
        direction: ltr;
        unicode-bidi: isolate;
      }
      .zoom-slider {
        flex: 1;
        height: 48px;
        margin: 0;
        background: transparent;
        outline: none;
        -webkit-appearance: none;
        appearance: none;
        cursor: pointer;
        direction: ltr;
      }
      .zoom-slider::-webkit-slider-runnable-track {
        height: 6px;
        background: var(--nli-line);
      }
      .zoom-slider::-moz-range-track {
        height: 6px;
        background: var(--nli-line);
        border: 0;
      }
      .zoom-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -7px;
        background: var(--nli-ink);
        border: 1px solid var(--nli-ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .zoom-slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        background: var(--nli-ink);
        border: 1px solid var(--nli-ink);
        border-radius: 50%;
        cursor: pointer;
      }
      .zoom-buttons {
        display: flex;
        gap: 6px;
        flex-shrink: 0;
      }
      .zoom-button {
        width: 48px;
        height: 48px;
        border: 2px solid var(--nli-line);
        background: var(--nli-cream);
        color: var(--nli-ink);
        font-size: 24px;
        font-weight: 300;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .zoom-button:active {
        background: var(--nli-ink);
        border-color: var(--nli-ink);
        color: var(--nli-paper);
      }
      .reset-btn {
        width: 100%;
        margin-top: var(--gap);
        flex-shrink: 0;
      }
      #freeTimeline {
        flex-shrink: 0;
        margin-top: var(--space);
      }

      .layer-sheet {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--space) var(--pad);
      }
      .layer-sheet[hidden] { display: none !important; }
      .layer-sheet-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(26, 26, 26, 0.28);
      }
      .layer-sheet-dialog {
        position: relative;
        z-index: 1;
        width: min(720px, 100%);
        max-height: min(78dvh, 820px);
        display: flex;
        flex-direction: column;
        background: var(--nli-paper);
        border: 1px solid var(--nli-ink);
        box-shadow: 0 16px 40px rgba(26, 26, 26, 0.12);
      }
      .layer-sheet-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: var(--space) var(--pad);
        border-bottom: 1px solid var(--nli-line);
        flex-shrink: 0;
      }
      .layer-sheet-heading .lede {
        margin: 4px 0 0;
        max-width: none;
      }
      .layer-sheet-close {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: var(--tap);
        height: var(--tap);
        min-width: var(--tap);
        min-height: var(--tap);
        color: var(--nli-ink);
        flex-shrink: 0;
      }
      .layer-sheet-close .icon {
        width: 22px;
        height: 22px;
      }
      .layer-sheet-body {
        min-height: 0;
        overflow: auto;
        padding: var(--space) var(--pad) calc(var(--space) + env(safe-area-inset-bottom));
        display: flex;
        flex-direction: column;
        gap: var(--space);
      }
      .layer-sheet-pack {
        border: 1px solid var(--nli-line);
        background: var(--nli-paper);
      }
      .layer-sheet-pack-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--nli-line);
        background: var(--nli-paper);
      }
      .layer-sheet-pack-title {
        font-size: var(--text-ui);
        font-weight: 600;
        line-height: 1.2;
      }
      .layer-sheet-pack-meta {
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
        white-space: nowrap;
      }
      .layer-sheet-rows {
        display: flex;
        flex-direction: column;
      }
      .layer-sheet-row {
        width: 100%;
        min-height: 52px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        text-align: start;
        border-bottom: 1px solid var(--nli-line);
        background: transparent;
      }
      .layer-sheet-row:last-child { border-bottom: 0; }
      .layer-sheet-row.is-on { background: var(--nli-cream); }
      .layer-sheet-row.is-locked { opacity: 0.4; cursor: default; }
      .layer-sheet-label {
        font-size: var(--text-ui);
        line-height: 1.25;
      }
      .layer-sheet-row.is-on .layer-sheet-label { font-weight: 600; }
      .layer-sheet-switch {
        width: 44px;
        height: 24px;
        flex-shrink: 0;
        border: 1px solid var(--nli-line);
        background: var(--nli-paper);
        position: relative;
      }
      .layer-sheet-switch::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        background: var(--nli-gray);
        inset-block-start: 3px;
        inset-inline-start: 3px;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .layer-sheet-row.is-on .layer-sheet-switch {
        background: var(--nli-yellow);
        border-color: var(--nli-ink);
      }
      .layer-sheet-row.is-on .layer-sheet-switch::after {
        transform: translateX(20px);
        background: var(--nli-ink);
      }
      [dir="rtl"] .layer-sheet-row.is-on .layer-sheet-switch::after {
        transform: translateX(-20px);
      }
      .layer-sheet-empty {
        margin: 0;
        padding: 14px;
        font-size: var(--text-meta);
        color: var(--nli-gray-2);
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (min-width: 600px) {
        .nav-list {
          grid-template-columns: 1fr 1fr;
          grid-template-rows: repeat(3, minmax(0, 1fr));
        }
        .step-note { -webkit-line-clamp: 5; }
        .screen-copy { -webkit-line-clamp: 4; }
      }

      /* Galaxy Tab 11 portrait: ~800×1280 CSS px */
      @media (min-width: 720px) and (min-height: 1000px) {
        :root {
          --text-ui: 19px;
          --text-h2: 28px;
          --text-status: 40px;
          --text-meta: 15px;
          --text-kicker: 13px;
          --tap: 56px;
          --header-btn: 72px;
          --header-icon: 48px;
          --pad: 32px;
          --gap: 12px;
          --space: 20px;
        }
        .locale button {
          min-width: 48px;
        }
        .nav-card { padding-inline: 24px; }
        .scene-list { min-height: 220px; }
        .scene-btn { min-height: 220px; padding: 22px 18px; }
        .dpad { width: 200px; height: 200px; }
        .step-note,
        .screen-copy {
          display: block;
          -webkit-line-clamp: unset;
          overflow: visible;
        }
      }

      /* Galaxy Tab 11 landscape: ~1280×800 CSS px */
      @media (min-width: 1000px) and (max-height: 900px) {
        :root {
          --text-ui: 18px;
          --text-h2: 24px;
          --text-status: 36px;
          --text-meta: 14px;
          --text-kicker: 12px;
          --tap: 52px;
          --header-btn: 64px;
          --header-icon: 40px;
          --pad: 28px;
          --gap: 10px;
          --space: 12px;
        }
        .kicker,
        .lede,
        .nav-card-meta,
        .scene-btn-meta { display: block; }
        .locale button {
          min-width: 44px;
        }
        .nav-list {
          grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(2, minmax(0, 1fr));
        }
        .nav-card { padding-inline: 20px; }
        .lede { max-width: 52ch; }
        .scene-list {
          min-height: 96px;
          grid-template-columns: repeat(4, 1fr);
          grid-template-rows: minmax(0, 1fr);
        }
        .scene-btn { min-height: 96px; padding: 14px 16px; }
        .dpad { width: 152px; height: 152px; }
        .player-body {
          display: grid;
          grid-template-columns: minmax(0, 1.2fr) minmax(0, 0.8fr);
          grid-template-rows: auto auto auto auto auto minmax(148px, 1fr);
          grid-template-areas:
            "top top"
            "ticks screens"
            "clock screens"
            "title screens"
            "note screens"
            "kit screens";
          column-gap: 36px;
          align-content: stretch;
        }
        .player-top { grid-area: top; }
        .ticks { grid-area: ticks; margin-bottom: 12px; }
        .clock { grid-area: clock; }
        .step-title { grid-area: title; }
        .step-note { grid-area: note; }
        .kit {
          grid-area: kit;
          margin-top: 8px;
          min-height: 148px;
        }
        .step-note {
          max-width: none;
          display: block;
          -webkit-line-clamp: unset;
          overflow: visible;
        }
        .screens {
          grid-area: screens;
          grid-template-columns: 1fr;
          gap: 16px;
          margin-top: 0;
          padding-top: 0;
          border-top: 0;
          border-inline-start: 1px solid var(--nli-line);
          padding-inline-start: 32px;
        }
        .screen-row + .screen-row {
          border-inline-start: 0;
          padding-inline-start: 0;
          border-top: 1px solid var(--nli-line);
          padding-top: 16px;
        }
        .screen-copy {
          display: block;
          -webkit-line-clamp: unset;
          overflow: visible;
        }
        .dock {
          grid-template-columns: minmax(180px, 1fr) minmax(280px, 1.8fr);
          gap: 12px;
          padding-block: 12px;
        }
      }

      @media (max-height: 700px) and (max-width: 500px) {
        .nav-card-meta,
        .scene-btn-meta { display: none; }
        .step-note { -webkit-line-clamp: 2; }
        .screen-copy { -webkit-line-clamp: 2; }
        .nli-tl-hours { display: none; }
        .nli-tl-scrub-row { padding-top: 8px; }
        .kit-reset { display: none; }
      }

    </style>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="header-side header-side--start">
          <button
            type="button"
            class="home-btn"
            id="homeBtn"
            hidden
            data-i18n-aria="home"
            aria-label="דף הבית"
          >
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="bevel" aria-hidden="true">
              <path d="M4 11 12 4l8 7" />
              <path d="M6 10.5V20h12v-9.5" />
              <path d="M10 20v-6h4v6" />
            </svg>
          </button>
        </div>
        <div class="header-side header-side--end">
          <span class="staff-connection" id="staffConnection"></span>
          <div class="locale" role="group" aria-label="Language">
            <button type="button" id="localeHe" data-locale="he" class="is-active" aria-pressed="true">עב</button>
            <button type="button" id="localeEn" data-locale="en" aria-pressed="false">EN</button>
          </div>
        </div>
      </header>

      <main class="main">
        <section class="screen is-active" id="home" data-screen="home">
          <div class="nav-list" id="narrativeList"></div>
        </section>

        <section class="screen" id="player" data-screen="player" hidden>
          <div class="player-body">
            <div class="player-top">
              <span class="badge-live" data-i18n="live">שידור</span>
              <span class="step-count" id="stepCount"></span>
            </div>
            <div class="ticks" id="ticks" aria-hidden="true"></div>
            <div class="clock" id="stepClock"></div>
            <h1 class="step-title" id="stepTitle"></h1>
            <p class="step-note" id="stepNote"></p>
            <div class="kit" id="playerKit">
              <p class="kit-reset" id="kitReset"></p>
              <div class="kit-block" id="kitTimeline" hidden></div>
              <div class="kit-block kit-action" id="kitPresentation" hidden>
                <button type="button" class="btn" id="presentationBtn">פתיחת מצגת</button>
              </div>
              <div class="kit-block kit-action" id="kitArchive" hidden>
                <button type="button" class="btn" id="archiveBtn">פתיחת ארכיון הספרייה</button>
              </div>
              <p class="kit-idle" id="kitIdle" hidden></p>
            </div>
            <div class="screens">
              <div class="screen-row">
                <span class="screen-label" data-i18n="gisLabel">מסך GIS</span>
                <p class="screen-copy" id="stepGis"></p>
              </div>
              <div class="screen-row">
                <span class="screen-label" data-i18n="modelLabel">הקרנה / מודל</span>
                <p class="screen-copy" id="stepModel"></p>
              </div>
            </div>
          </div>
          <div class="dock">
            <button type="button" class="btn btn--outline" id="prevBtn" data-i18n="prev">הקודם</button>
            <button type="button" class="btn" id="nextBtn" data-i18n="next">הבא</button>
          </div>
        </section>

        <section class="screen" id="free" data-screen="free" hidden>
          <div class="search">
            <svg class="search-icon icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="square" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-3.5-3.5"></path>
            </svg>
            <label class="visually-hidden" for="searchInput" data-i18n="searchLabel">חיפוש שם או מקום</label>
            <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="חיפוש שם או מקום" />
            <ul class="results" id="searchResults"></ul>
          </div>
          <p class="free-status" id="freeStatus"></p>
          <div class="scene-list" id="sceneList"></div>
          <div class="free-deck">
            <div class="free-navigate" dir="ltr">
              <div class="dpad-container" dir="ltr">
                <div class="dpad" dir="ltr">
                  <button type="button" class="dpad-button dpad-up" id="panNorth" data-i18n-aria="panNorth" aria-label="הזזה צפונה">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <polyline points="18 15 12 9 6 15"></polyline>
                    </svg>
                  </button>
                  <button type="button" class="dpad-button dpad-left" id="panWest" data-i18n-aria="panWest" aria-label="הזזה מערבה">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                  </button>
                  <button type="button" class="dpad-button dpad-right" id="panEast" data-i18n-aria="panEast" aria-label="הזזה מזרחה">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                  </button>
                  <button type="button" class="dpad-button dpad-down" id="panSouth" data-i18n-aria="panSouth" aria-label="הזזה דרומה">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                      <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                  </button>
                  <div
                    class="joystick-container joystick-zone"
                    id="joystickZone"
                    dir="ltr"
                    data-i18n-aria="joystickAria"
                    aria-label="מוט כיוון לגרירת המפה"
                  >
                    <div class="joystick-base" aria-hidden="true"></div>
                  </div>
                </div>
              </div>
              <div class="zoom-controls">
                <div class="zoom-display">
                  <span class="zoom-label" data-i18n="zoomLabel">זום:</span>
                  <span class="zoom-value" id="zoomValue">—</span>
                </div>
                <div class="zoom-slider-container">
                  <input
                    type="range"
                    id="zoomSlider"
                    class="zoom-slider"
                    min="10"
                    max="19"
                    value="15"
                    step="1"
                    data-i18n-aria="zoomLevelAria"
                    aria-label="רמת מיקוד"
                  />
                  <div class="zoom-buttons">
                    <button type="button" class="zoom-button zoom-out" id="zoomOut" data-i18n-aria="zoomOutAria" aria-label="התרחקות">−</button>
                    <button type="button" class="zoom-button zoom-in" id="zoomIn" data-i18n-aria="zoomInAria" aria-label="התקרבות">+</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="free-bottom">
            <button type="button" class="btn" id="freeArchiveBtn" hidden>פתיחת ארכיון הספרייה</button>
            <div id="freeTimeline"></div>
            <button type="button" class="btn btn--outline reset-btn" id="resetBtn" data-i18n="reset">סיום ואיפוס</button>
          </div>
        </section>
      </main>
      <div class="layer-sheet" id="staffPackMenus" hidden></div>
      <div id="table-switcher" hidden></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"></script>
    <script type="module" src="./src/entries/nli-staff-remote-main.js"></script>
  </body>
</html>

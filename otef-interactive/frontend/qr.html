<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico" sizes="any">
    <title>OTEF — שלט רחוק להקרנה</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/remote-styles.css">
    <style>
        :root {
            --qr-print-pad: 14px;
            --font-ui: "Heebo", "Noto Sans Hebrew", "Segoe UI", sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100dvh;
            box-sizing: border-box;
            overflow: auto;
            background: radial-gradient(circle at center, #151520 0%, #0a0a0f 100%);
            font-family: var(--font-ui);
        }

        .qr-page {
            width: 100%;
            max-width: 420px;
        }

        .qr-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 36px 32px 32px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(20px);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .headline {
            margin: 0 0 10px;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.3;
        }

        .tagline {
            margin: 0 0 24px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .qr-wrap {
            display: flex;
            justify-content: center;
            margin: 0 0 20px;
        }

        #qrcode {
            background: #fff;
            padding: 16px;
            border-radius: 12px;
            display: inline-block;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.2);
        }

        #qrcode img,
        #qrcode canvas,
        #qrcode svg {
            display: block;
            vertical-align: top;
        }

        #qrcode svg {
            width: 256px;
            height: 256px;
        }

        .net-note {
            font-size: 0.95rem;
            font-weight: 500;
            line-height: 1.55;
            color: var(--text-secondary);
        }

        .share-modes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 0 0 16px;
        }

        .share-qr-modes {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 0 0 12px;
        }

        .share-modes button,
        .share-qr-modes button {
            min-height: 44px;
            padding: 0 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background: transparent;
            color: var(--text-primary);
            font: inherit;
            font-weight: 650;
            cursor: pointer;
        }

        .share-modes button[aria-pressed="true"],
        .share-qr-modes button[aria-pressed="true"] {
            background: #2b6cb0;
            color: #eaf3ff;
            border-color: #4c8fd4;
        }

        .share-status {
            margin: 8px 0 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .url-foot {
            margin-top: 16px;
            font-size: 0.7rem;
            line-height: 1.4;
            color: var(--text-muted);
            word-break: break-all;
            opacity: 0.85;
            font-weight: 400;
            font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
            direction: ltr;
            unicode-bidi: isolate;
        }

        @media print {
            @page {
                size: a4;
                margin: 15mm;
            }

            * {
                animation: none !important;
            }

            body {
                background: #fff !important;
                padding: 0;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .qr-page {
                max-width: none;
            }

            .qr-card {
                max-width: 88mm;
                margin: 0 auto;
                padding: 10mm 8mm 10mm;
                background: #fff;
                border: 1px solid #999;
                border-radius: 4px;
                box-shadow: none;
                backdrop-filter: none;
            }

            .share-modes,
            .share-qr-modes {
                display: none;
            }

            .headline {
                color: #111;
            }

            .tagline,
            .net-note {
                color: #333;
            }

            .share-status {
                color: #555;
            }

            .url-foot {
                color: #555;
            }

            #qrcode {
                box-shadow: none;
                border: 1px solid #ddd;
            }

            .qr-wrap {
                margin-bottom: 5mm;
            }

            #qrcode {
                padding: var(--qr-print-pad);
            }

            #qrcode img,
            #qrcode canvas,
            #qrcode svg {
                width: 45mm !important;
                height: 45mm !important;
            }
        }
    </style>
</head>
<body>
    <div class="qr-page">
        <div class="qr-card">
            <h1 class="headline">שלט רחוק להקרנה</h1>
            <p class="tagline">סרקו את הקוד לפתיחת השלט</p>
            <p class="net-note">Connect on the same Wi-Fi, or use Tailnet off-LAN.</p>
            <div class="share-modes" role="group" aria-label="Share network">
                <button id="shareModeLocal" type="button">Local</button>
                <button id="shareModeTailnet" type="button">Tailnet</button>
            </div>

            <div class="qr-wrap">
                <div id="qrcode" role="img" aria-label="קוד QR לפתיחת השלט"></div>
            </div>
            <div class="share-qr-modes" role="group" aria-label="Share remote">
                <button id="shareQrRemote" type="button">Regular</button>
                <button id="shareQrNli" type="button">NLI</button>
            </div>
            <p class="share-status" id="shareStatus" role="status">Loading network address…</p>

            <p class="url-foot" id="targetUrl" translate="no" dir="ltr">---</p>
        </div>
    </div>

    <script type="module" src="./src/entries/qr-main.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <title>OTEF Projection Calibration</title>
    <style>
      @font-face {
        font-family: "Guttman Hatzvi";
        src: url("./fonts/Guttman-Hatzvi.ttf") format("truetype");
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
    </style>
    <link rel="stylesheet" href="./src/projection-config/config.css" />
  </head>
  <body>
    <main id="projectionConfig" aria-label="OTEF projection calibration"></main>
    <script src="https://unpkg.com/proj4@2.9.0/dist/proj4.js"></script>
    <script>
      proj4.defs(
        "EPSG:2039",
        "+proj=tmerc +lat_0=31.73439361111111 +lon_0=35.20451694444445 +k=1.0000067 +x_0=219529.584 +y_0=626907.39 +ellps=GRS80 +towgs84=-24.0024,-17.1032,-17.8444,0.33077,-1.85269,1.66969,5.4248 +units=m +no_defs",
      );
    </script>
    <script type="module" src="./src/entries/projection-config-main.js"></script>
  </body>
</html>

services:
  nur-api:
    container_name: nur-api
    build: ./nur-io/django_api/.
    ports:
      - "${API_PORT}:9900"
    env_file:
      - .env
    volumes:
      - ./nur-io/django_api/.:/app
      - nur-api_data:/app/data
      - media_files:/app/media
      - ./nur-io/django_api/public:/app/public_idistrict
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9900 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s
    command:
      [
        "sh",
        "-c",
        "chmod +x /app/init.sh && /app/init.sh",
      ]
    networks:
      - nur_core

  dashboard-builder:
    container_name: dashboard_builder
    build:
      context: ./nur-front/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_MAPBOX_ACCESS_TOKEN=${REACT_APP_MAPBOX_ACCESS_TOKEN}
    environment:
      - REACT_APP_MAPBOX_ACCESS_TOKEN=${REACT_APP_MAPBOX_ACCESS_TOKEN}
    env_file:
      - .env
    volumes:
      - dashboard_build:/app/build-volume
    networks:
      - nur_core

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-front
    env_file:
      - .env
    volumes:
      - ./nur-projection/frontend:/usr/share/nginx/html/nur-projection/frontend
      - ./nur-remote-controller/frontend:/usr/share/nginx/html/nur-remote-controller/frontend
      - dashboard_build:/usr/share/nginx/html/nur-front/frontend
      - media_files:/usr/share/nginx/html/media
    ports:
      - "${FRONT_PORT}:80"
    depends_on:
      nur-api:
        condition: service_healthy
      dashboard-builder:
        condition: service_started
    restart: always
    networks:
      - nur_core

  db:
    container_name: db
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data_core:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - nur_core

  redis:
    image: redis:alpine
    container_name: redis-cs
    restart: always
    networks:
      - nur_core

networks:
  nur_core:
    name: nur_core
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: nur_core
    labels:
      com.docker.compose.network: "nur_core"
    external: false

volumes:
  postgres_data_core:
  dashboard_build:
  nur-api_data:
  media_files:
